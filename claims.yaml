- id: abs-prod
  kind: computation
  passage: In an illustrative model with stipulated parameters, a finished-output tool and a fading structured
    tool reach the same production frontier (0.87), but competence ends at 0.15 and 0.84 respectively;
    on tool removal, output falls by 83.1% and 10.3%; the fraction of the production advance retained
    as capability is 0.10 and 0.99; and the ordering holds in all of 2,000 seeded parameter perturbations.
  evidence:
    file: simulation/output/results.json
    run_id: ratchet
    pointer: /summary/production_finished_frontier
    reported: '0.87'
    units: production frontier
    conditions: illustrative model, stipulated parameters, 30 sessions
    decimals: 2
