abstract: "Genius is usually located in a person. This paper locates most of its cultural work in the environment a learner inherits, the exemplars, tools, and possibility-spaces that exceptional achievements leave behind, and treats education as the process that converts that distributed inheritance into individual capability. Cumulative-culture theory explains how a civilization keeps its gains across generations through a ratchet, but not how a kept gain becomes an individual's usable and extendable skill, and that conversion is what a theory of education has to describe. The paper's operational core is a distinction among three frontiers: the production frontier, the best output a learner can put on the page with the tools at hand; the competence frontier, what the learner can independently generate and revise; and the judgment frontier, what the learner can reliably evaluate and select. Generative AI expands production almost immediately while leaving competence and judgment near their starting values, and the resulting gap is false ratcheting, sophisticated output unbacked by durable capability, revealed the moment the tool is withdrawn. The distinction is measurable, which is what separates the framework from a metaphor: test the learner with the tool present and again with it absent, and read the difference. An accompanying illustrative model makes the logic explicit. Under one learning dynamics, a finished-output tool and a structured tool that fades both reach the same production frontier near 0.87, yet competence ends at 0.15 in the first case and 0.84 in the second; hand every learner the tool at a common strength and then remove it, and displayed output collapses by 83 percent for the finished-output tool against 10 percent for the fading one; the genuine-ratchet fraction is 0.10 against 0.99, and the ordering survives 2,000 seeded parameter perturbations. The model is illustrative, its parameters stipulated to instantiate the definitions rather than measured from learners. The framework then states its predictions as falsifiable claims: AI ratchets capability genuinely when it decomposes an achievement, elicits prediction and explanation before revealing answers, generates controlled contrasts, preserves productive difficulty, and withdraws its own assistance, and it counterfeits capability when it mainly supplies finished products. A randomized trial of a scaffolded physics tutor and a field experiment with an unrestricted chatbot already show the predicted split, and the paper specifies the measurements that would confirm or break the account."
